# Manager v2 · verified against official Codex docs on 2026-09-24.
# Project file: <project>/.codex/config.toml (NOT /.codex/config.toml).
# Merge existing MCP/provider settings; do not overwrite ~/.codex/config.toml.
# Two-tier native model policy: Sol/xhigh is the primary default; only bounded light roles override to Luna/max.
model = "gpt-6-sol"
model_reasoning_effort = "xhigh"
approval_policy = "on-request"
default_permissions = "manager-normal"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-6-sol"
default_subagent_reasoning_effort = "xhigh"
interrupt_message = true

# Standalone roles are discovered from .codex/agents/*.toml by current Codex.
# Legacy [agents.<name>].config_file declarations remain supported by the doctor.

# Local app/browser verification is allowed through the explicit loopback allowlist.
# Package installation/external APIs require an operator-approved domain addition.
[features]
network_proxy = true

[permissions.manager-normal]
description = "Manager orchestration and active changes; immutable archives and policy."
extends = ":workspace"

[permissions.manager-normal.filesystem.":workspace_roots"]
"openspec/changes/archive" = "read"
"manager/archive" = "read"
"openspec/specs" = "read"
"manager/policy.yaml" = "read"
"manager/roles.yaml" = "read"
"AGENTS.md" = "read"
"CLAUDE.md" = "read"
".codex" = "read"
".github" = "read"
".env" = "deny"
".env.local" = "deny"
".env.production" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"

[permissions.manager-normal.network]
enabled = true

[permissions.manager-normal.network.domains]
"localhost" = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"

[permissions.manager-worker]
description = "Code worker; no planning, requirement or historical artifact writes."
extends = "manager-normal"

[permissions.manager-worker.filesystem.":workspace_roots"]
"manager" = "read"
"openspec" = "read"
"docs/prd" = "read"
"docs/technical" = "read"
"docs/design/baselines" = "read"
# Workers may write only evidence here; individual run directories are instruction scoped.
"manager/runtime/evidence" = "write"

[permissions.manager-review]
description = "Source read-only; only evidence and temp outputs writable."
extends = ":read-only"

[permissions.manager-review.filesystem.":workspace_roots"]
"manager/runtime/evidence" = "write"
".env" = "deny"
".env.local" = "deny"
".env.production" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"

[permissions.manager-review.filesystem]
":tmpdir" = "write"
":slash_tmp" = "write"

[permissions.manager-review.network]
enabled = true

[permissions.manager-review.network.domains]
"localhost" = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"

# No archive-writer profile here. Archive/prune are separate, explicit operator actions.
# Do NOT mix this file with sandbox_mode / sandbox_workspace_write in ANY loaded layer.
# Do NOT launch with --yolo or change parent permissions mid-run: live parent overrides
# can be reapplied to children and defeat narrower agent defaults.
