services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 容器内通过 service 名互联，端口用容器内端口（非宿主机映射端口）
      DATABASE_URL: postgresql://app:app@postgres:5432/app_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
