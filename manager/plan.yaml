  - wardrobe-ui-source
  - wardrobe-mobile-layout
  note: 交付个人城市入口、搜索/保存、用户触发定位/解析及规范化天气 API，覆盖拒绝/取消/失败、无位置、地区/用户时区差异和过期降级。 消费 NLCY6 与 QL83M/JGka6 城市区域；首页天气由 M3 接线，不以未来推荐页验收天气提供方。
    CityPort/WeatherPort 注入适配以契约/时效样本检查，缺配置如实 unavailable；生产适配需实际服务协议，真实 AC-014/015 保留待联调，不以 mock 冒充。
- id: durable-outfit-recommendation-runtime
  requirements:
