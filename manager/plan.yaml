  - wardrobe-ui-source
  - wardrobe-mobile-layout
  note: 交付微信登录/个人资料/时区/退出与本人衣物录入、浏览筛选分页、编辑、三态/归档恢复的完整路径；包含私有媒体、上传验证、幂等/版本、失败保留、媒体引用/清理竞争及会话隔离。媒体清理需要核对衣物/资料绑定，同一
    Change 内完成真实消费者，不能先假定后续引用表存在。设计消费 asaVm、QL83M/JGka6 账户/资料/时区/退出区域、LgGyr、ddC69/zkPuC、WV7wn/StjQC、Ro2vL/FfxoI/Y8xJCl/jxBYZ、phKmP/zXmjy/kopCO、m0rZ7/SKORD。偏好/城市区域由各自
    Change 接线；本项建立可消费的导航/固定动作壳、session generation、属性目录及上下文修订。代码检查包括 PostgreSQL 媒体生命周期、首次微信身份竞争和现有 Web 密码认证迁移兼容；不要求后续推荐或历史页面证明本项完成。详情计数由记录/统计消费者接入，完整三
    Tab 由最终推荐集成验收；不能用假数据冒充下游。
