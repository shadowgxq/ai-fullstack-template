batches:
- id: M1
  depends_on: []
  changes:
  - personal-wardrobe-management
  checkpoint: auto
  status: planned
  human_acceptance: pending
  checks:
  - 微信身份/资料、私有媒体与本人衣物录入/浏览/编辑/状态接线；退出/切账号清缓存、图片与迟到结果。
  - PostgreSQL 检查约束/并发幂等、媒体清理竞争及密码账号迁移兼容；提供方 OpenAPI 与小程序直接消费者一致。
  - 已实施页面静态检查 Taro/Token、主题、导航壳、固定动作/滚动/键盘归属；不隐式启动浏览器、构建或开发服务。
  note: 交付可管理的本人衣柜；身份、媒体、资料、衣物及引用清理在同一 Change 内闭合，内部任务按契约和迁移顺序实施。TD-1 与本计划仍待联合内容确认，本次规划不代表开发授权或人工通过，设计最新局部接受状态见
    progress。人工验收保留 pending，auto 不新增逐阶段签字；运行检查按项目权限/环境条件执行。
- id: M2
  depends_on:
  - M1
  changes:
  - wear-history-and-statistics
  - personal-outfit-preferences
  - city-and-weather-context
  checkpoint: auto
  status: planned
  human_acceptance: pending
  checks:
  - 用 M1 真衣物补录/修正/删除，核对快照、详情计数、归档统计及 30 日/时区边界；偏好/城市写入更新同一上下文修订。
  - 个人资料/偏好/城市/时区独立保存，失败保留输入；定位取消/拒绝与天气缺失不阻断衣柜/记录。
  - 提供方按天气/城市契约及替身验证时效与降级；生产适配与真实集成另留证据，缺配置不伪造天气。
  note: 交付可纠错的穿着事实/统计及可保存的推荐条件，三项均不依赖推荐 UI。 共享 revision/profile、页面注册、迁移和 backend OpenAPI 生成物，不承诺无冲突并行；Execute 按实际写入范围串行整合。
    按 M1 实际目录/DTO/宿主结果细化局部任务，不改变既定所有权和历史语义。
  planning_boundary: 城市/天气供应商、地理/时区覆盖和微信位置配置未提供。接口/端内状态及离线契约可验证，生产适配和真实联调须服务事实具备后细化。 实际协议若影响共享契约先修同一 TD-1，不以伪服务解除缺口。
- id: M3
  depends_on:
