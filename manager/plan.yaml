  - BR-008
  - AC-020
  - FR-002
  depends_on: []
  status: planned
  technical_design:
  - docs/architecture/wardrobe/features/wardrobe-and-history.md#3-私有媒体生命周期
  - docs/architecture/wardrobe/overview.md#4-微信登录与个人设置
  - docs/architecture/wardrobe/overview.md#5-小程序状态与宿主实现
  - docs/architecture/wardrobe/features/wardrobe-and-history.md#1-数据归属与事务顺序
  - docs/architecture/wardrobe/features/wardrobe-and-history.md#2-衣物与属性
  input_refs:
