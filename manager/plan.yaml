requirements:
- id: FR-001
  source: docs/product/01-prd-draft.md#fr-001-衣物入库查看和编辑
  code_acceptance:
  - AC-001/021：照片或 trim 后名称至少一项，照片必须上传成功；其他属性可空且保持未知，不同创建键允许重复录入。
  - AC-002/016：保存/编辑读取一致，失败保留草稿，同次保存重试不重复创建；历史快照与后续推荐分别由实际消费者检查。
  - AC-023：分类/主要颜色可清除，季节/场合/标签多选、自定义标签去重；更多属性折叠不丢值，拍照/相册取消不覆盖原输入。
  human_acceptance:
  - 验收添加/编辑、媒体权限、弹层、键盘避让及末项可操作性；按设计检查双主题和必要窄屏。
- id: FR-002
  source: docs/product/01-prd-draft.md#fr-002-衣柜管理与可用状态
  code_acceptance:
  - 浏览、已填属性筛选/分页、详情/编辑接通本人持久化数据，区分空衣柜与筛选为空。
  - AC-007：可穿/暂不可穿/归档三态和恢复有效，无永久删除；推荐仅用可穿衣物由推荐消费者检查。
  - AC-002/007：改名/改类/归档不改既有名称/类别快照和计数，由记录/统计消费者检查。
  human_acceptance:
  - 验收衣柜筛选、详情、归档/恢复及返回刷新，确认无永久删除入口。
- id: FR-003
  source: docs/product/01-prd-draft.md#fr-003-个人穿搭偏好
  code_acceptance:
  - 长期喜欢/避免风格和颜色、场合偏好及可选舒适度可保存/清除；空偏好合法，失败保留草稿与原有效值。
  - AC-013：推荐使用当前偏好，明确避免项确定性排除，无候选说明原因，未知属性不当作已满足，不声称已学习用户喜好。
  - AC-019：当次场景不覆盖长期偏好；偏好写入递增上下文修订，防止旧推荐成为当前有效结果。
  human_acceptance:
  - 验收偏好入口、保存/取消及推荐中的缺失与排除说明。
- id: FR-004
  source: docs/product/01-prd-draft.md#fr-004-实际穿着记录
  code_acceptance:
  - AC-003/004：仅明确保存产生实际记录，同日可多套，单条衣物去重；同键并发或超时重试只新增一条。
  - AC-005/016：手动补录/查看/修正/删除误记录闭合，失败保留输入，关联原子更新，迟到请求不能复活已删记录。
  - AC-017：有效用户时区校验过去/当天/未来，默认 Asia/Shanghai；时区变化重新确认，历史名称/类别快照不随衣物变化。
  - 推荐确认由推荐 Change 接入同一记录表单；补录/修正验收不依赖未实现推荐页。
  human_acceptance:
  - 验收日期、多选完成/取消、修正/删除及推荐确认，确认无自动记穿着。
- id: FR-005
  source: docs/product/01-prd-draft.md#fr-005-统计与说明
  code_acceptance:
  - AC-018：库存总数只含可穿与暂不可穿，归档单列；类别按当前属性汇总并含未分类。
  - AC-004/005/007：实际穿搭与单件次数基于记录事实、同条去重；修正/删除即时反映，归档既有记录继续计数。
  - AC-011/017：默认近 30 个自然日含首尾/补零，显示时区与范围；无记录不宣称从未穿过。
  human_acceptance:
  - 验收记录内统计入口、指标/趋势范围与空态说明，确认与历史一致。
- id: FR-006
  source: docs/product/01-prd-draft.md#fr-006-ai-穿搭建议
  code_acceptance:
  - AC-006/009：只用本人可穿库存；缺属性/历史/偏好仍按可支持信息推荐，不固定套数或品类，不虚构衣物或完整搭配。
  - AC-008/014/015：定位失败可手动选城；天气地区/日期/更新时间有来源，缺失不阻断推荐，不用伪造或过期天气。
  - AC-002/007/013：冻结当前库存/偏好/历史，确定性排除、输出检查和发布/读取修订校验阻止越权与过期结果。
  - AC-012：失败/取消反馈真实结果，不改衣物和历史；幂等派发、取消竞争、Checkpoint 和外部响应丢失具备明确恢复/预算证据。
  - AC-003/019：场景只影响本次，换整组重新请求，替换单件保留其他选择并更新依据；确认穿着显式调用已有记录契约。
  - 推荐依据默认展开，缺失如实说明；最近穿着只作简要入口，空库存引导与有库存布局按设计区分。
  human_acceptance:
  - 验收推荐、场景/替换/换整组、失败重试/取消及确认穿着；真实天气/模型联调单独留证。
- id: BR-008
  source: docs/product/01-prd-draft.md#2-用户流程与权限
  code_acceptance:
  - AC-010/022：未登录不读个人资源，双账号逐资源隔离，涵盖媒体内容、衣物、偏好、历史、统计及推荐 scope。
  - 会话切换/401/退出清理 Token、Query、草稿、搭配与私有图片；旧会话迟到结果不能进入新会话，不公开个人数据。
  human_acceptance:
  - 验收双账号切换、登录失效及退出后无旧数据展示。
- id: AC-022
  source: docs/product/01-prd-draft.md#2-用户流程与权限
  code_acceptance:
  - 微信 code 经后端交换，首次建身份、再次进入同账号；失败/取消可重试，无密码/手机号要求，不自动获取资料/定位。
  - AC-023：默认头像与衣柜用户不阻塞使用，头像昵称选填、保存/取消独立；时区即选即存，失败保留有效设置，退出符合服务端撤销语义。
  - 微信身份/可空密码迁移兼容既有 Web 密码认证；code、Token、session_key 不泄露。
  human_acceptance:
  - 真实微信登录、资料填写、时区及退出待验；保留最新登录/个人局部设计待验状态。
- id: AC-020
  source: docs/product/01-prd-draft.md#2-用户流程与权限
  code_acceptance:
  - 主导航仅衣柜/穿搭/记录，统计归记录、个人为二级页，导航方法/返回栈正确，不遗留可达模板示例。
  - 自定义导航使用真实胶囊/安全区，固定区与中间滚动分区，天气随内容滚动；表单键盘出现隐藏固定动作。
  - Taro/本端 Token 双主题接线，静态检查注册、inset/滚动归属与至少 48px 命中区；不将静态结果当视觉通过。
  human_acceptance:
  - 真机验收三 Tab、返回、胶囊/安全区、键盘和末项可操作性；按 390px 主稿及必要窄屏/双主题最终验收。
inputs:
- id: wardrobe-ui-source
  source: docs/design/wardrobe-ui-ux.md
  purpose: reference
  required: true
  scope:
  - docs/design/wardrobe.pen；SHA-256 e425e1930f9706d8a06a1632adb501d9c648b144f452a471bcd08e566009c183；导入公共库别名 z。
  - 按各 Change note 定向消费真实页面/局部 Frame 和通用状态；390×844、双主题及必要 360/375/430px。
  - 整体方向已有确认；最新添加衣物/个人/登录/宿主局部仍待验，规划不扩大原接受范围。
- id: wardrobe-mobile-layout
  source: docs/design/mobile/wardrobe-ui-spec.md
  purpose: reference
  required: true
  scope:
  - 自定义导航/Tab、胶囊/安全区、固定动作/滚动、键盘、流式布局/触控及文中 Token 来源。
- id: wardrobe-shared-contracts
  source: docs/architecture/wardrobe/overview.md#3-边界数据与公共契约
  purpose: contract
  required: true
  scope:
  - TD-1 的归属、资源版本、幂等、上下文修订、分页和跨库职责；内容摘要在 progress 固定。
  - 实施后由提供方导出 OpenAPI 再生成小程序类型，拟议接口不冒充当前能力。
