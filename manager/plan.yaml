  - BR-008
  depends_on: []
  status: planned
  technical_design:
  - docs/architecture/wardrobe/features/recommendations.md#3-候选约束与模型契约
  - docs/architecture/wardrobe/features/recommendations.md#43-可信用户-scope
  - docs/architecture/wardrobe/features/recommendations.md#6-ai-workflow调用账本与预算
  input_refs:
  - wardrobe-shared-contracts
  note: 独立交付 wardrobe.recommend.v1、可信 scope、结构化 DTO/gate、ModelPort、Ledger/预算、取消及 Checkpoint 恢复；保持 echo 契约和旧状态恢复。
    真实消费者是 backend 推荐调度；固定 DTO fixture 可独立检查跨 scope、并发幂等、失锁与各崩溃窗口，无需业务推荐页。 默认零外部请求，sending 无响应为 unknown 且不盲重发；deterministic/recorded
    不证明生产模型可用/费用。 生产适配器在选定服务后细化；仅 AI 协议和直接消费者，生成快照由协调者整合；无 UI，不挂 Pen 输入。
