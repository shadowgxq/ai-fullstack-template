  - wardrobe-ui-source
  - wardrobe-mobile-layout
  note: 同一事实生命周期内交付手动补录/修正/删除、历史分页、统计与详情次数，包含日期/快照、去重、幂等墓碑及聚合。 设计消费 HI38Z/C0p2tC、tz4GK/RYACG、mKPcR、ywaWl/a7xEg、m0rZ7/SKORD
    及详情计数；日期提示使用有效时区。 用 M1 真衣物检查改名/改类/归档、修改/删除统计、未来日期及集合归属。推荐确认仅消费已定义输入，实际接线在 M3 重验 AC-003/004，不阻塞本项。
- id: personal-outfit-preferences
  requirements:
