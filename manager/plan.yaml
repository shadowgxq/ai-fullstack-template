  - wardrobe-ui-source
  - wardrobe-mobile-layout
  note: 交付上下文冻结/硬过滤、推荐资源及同事务待办、调度/对账、取消/过期恢复、发布/读取修订检查、穿搭页及明确确认实际穿着。 消费 P9tls/ZHXw9、Q3U4y、AvD3c、NLCY6 天气上下文、tz4GK/RYACG、SKORD；记录表单只补推荐来源，不重做既有页面。
    场景/换整组/替换保持独立语义并更新依据，不误写偏好或历史；确认调用已验证记录契约，缺信息/无候选/服务失败/取消分别检查。 完成三 Tab/记录统计/个人入口、自定义导航和固定区真实接线，移除无消费者模板示例，不用假数据替代上游。
