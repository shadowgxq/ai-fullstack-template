<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap"
      rel="stylesheet"
    />
    <!-- 首帧静态标题：必须与 DEFAULT_LOCALE(en) 一致。挂载后由 DocumentTitleSync 按语言更新为
         app.title；但爬虫、链接预览、JS 未执行时只读得到这里，写中文会让英文站被抓成中文标题。 -->
    <title>Company Research</title>
    <script>
      // No-FOUC: 渲染前根据持久化的主题预设 <html data-theme>，与 shared/theme 一致（产品默认浅色）。
      (function () {
        var mode = 'light';
        try {
          var raw = localStorage.getItem('ui-theme');
          var storedMode = raw ? JSON.parse(raw).state.mode : null;
          mode = storedMode === 'light' || storedMode === 'dark' ? storedMode : mode;
        } catch (e) {
          /* 忽略：localStorage 不可用时使用产品默认浅色 */
        }
        document.documentElement.dataset.theme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
