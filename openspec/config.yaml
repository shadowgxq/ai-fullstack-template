schema: spec-driven
context: |
  全栈 monorepo：frontend / 可选 miniprogram / backend / ai-service；先读 AGENTS.md 与 docs/README.md 的任务路由。
  工程规范唯一在 docs/engineering；产品 docs/product，技术总/专项 docs/architecture，跨端语义 docs/contracts。
  frontend/design 与 miniprogram/design 分别拥有本端设计稿、视觉规范、Token 政策与交接；docs/design 只维护跨端入口、共享配色和通用交付约定。
  frontend 的 Web 基线由 scripts/frontend-source.json 与前端专项文档记录；不在 Web 内复制第二套 UI 或共享文档。
  miniprogram 独立维护微信 UI 与平台规范，共用根 PRD/架构/契约/Plan/OpenSpec；不复制通用 Skills 或预设双端业务范围。
  Manager 机制按全局安装的 MANAGER-WORKFLOW.md 和相应 Skill；通过客户端提供的实际 Skill 路径读取，生命周期不手工重建。
  v2 plan 使用 requirements/inputs/openspec/batches；集中 inputs 加显式 input_refs，技术方案/UI 基线专用字段。
  规划深度、制品生成与执行授权独立；依据稳定性选择 full/rolling，按已授权批次与 checkpoint/manual 边界执行。
  原生派发、代码/契约、Gate 和 UI 证据须真实，不用静态检查冒充业务验收。
  归档、合并、发布分别授权；历史只读。模板初始没有业务审批或历史运行记录。
rules:
  proposal:
    - 引用真实产品行为、验收归属、范围和非目标；单 change 的验收只依赖自身及显式依赖。
  specs:
    - 仅写本次行为增量；保留失败、权限、恢复与持久性要求，不迁就实现删减批准目标。
  design:
    - 引用已批准总/专项技术方案与版本，说明本次差异、接口、迁移与适用失败路径。
    - 新 UI 使用批准基线；代码问题用最小修复，需求/设计变更走影响分析及重新批准。
  tasks:
    - 明确 owner、读写路径、依赖、资源、验收与证据；Task DAG 不等于重复执行完整 apply。
    - 单一协调者核对后更新 tasks；先保存代码 checkpoint，再验证与追加修复，未运行不标通过。
