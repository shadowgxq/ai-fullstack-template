name: Sync source review
on:
  push:
    branches: [refactor/sync-standard-frontend-manager]
    paths: [.github/workflows/sync-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz 02663b66ada5fe8b159ea54fc5250f9b8c1b7e89 -o /tmp/sync-baseline.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sync-baseline
          path: /tmp/sync-baseline.tar.gz
          retention-days: 1
