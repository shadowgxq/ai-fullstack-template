name: Validate frontend refresh before commit
on:
  push:
    branches: [feat/refresh-frontend-template-20260920]
permissions:
  contents: write
jobs:
  refresh:
    if: >-
      github.event.head_commit.message == 'chore: apply verified frontend refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply integrity-checked migration to its exact baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for sha in c070a8d35465d934d92e82eae5fc70a80afda741 ab42c0764a4972f1d2e9429465a3349ad2850d73 53db3c2b282c8a53df6647c64e605145e1f99be0 a4ede0352706c5a0f404b1e28173089aa2a17d90 815a19680c498bdd4ef90cf0518858a51accbf07 2cd730605a2a0275e9f5ab0a4d4ef0255f7caca6; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 -d >> /tmp/refresh.json.xz
          done
          python3 - <<'PY'
          import hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          data = Path('/tmp/refresh.json.xz').read_bytes()
          assert hashlib.sha256(data).hexdigest() == 'ea800df5d8f8daf47d0fb1e0fa03fba3d06f9243b6ebb74fd0307c7f247173f5'
          payload = json.loads(lzma.decompress(data))
          prepared = []
          for name, record in payload['files'].items():
              relative = PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              assert name.startswith(('frontend/', 'docs/engineering/frontend/'))
              path = Path(name)
              assert not path.is_symlink()
              baseline = record['base_sha256']
              if baseline is None:
                  assert not path.exists(), f'New path already exists: {name}'
                  old = ''
              else:
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == baseline, f'Baseline changed: {name}'
                  old = path.read_text(encoding='utf-8')
              if 'edits' in record:
                  for start, end, replacement in reversed(record['edits']):
                      old = old[:start] + replacement + old[end:]
                  content = old
              else:
                  content = record['content']
              prepared.append((path, content))
          for path, content in prepared:
              if content is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(content, encoding='utf-8')
          Path('/tmp/check_frontend_browser.py').write_text(payload['browser_check'], encoding='utf-8')
          print(f'Applied {len(prepared)} scoped files with baseline verification.')
          PY
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm check && pnpm build
        working-directory: frontend
      - run: make docs architecture
      - name: Install disposable browser validation tools
        run: |
          python3 -m venv /tmp/browser-venv
          /tmp/browser-venv/bin/pip install playwright==1.55.0
          /tmp/browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Verify responsive layouts and real browser interactions
        run: /tmp/browser-venv/bin/python /tmp/check_frontend_browser.py
      - name: Commit only the verified migration on its feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend docs/engineering/frontend
          git diff --cached --check
          git commit -m 'feat(frontend): refresh reusable template and consolidate documentation'
          git push origin HEAD:feat/refresh-frontend-template-20260920
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-validation
          path: /tmp/frontend-refresh-validation
          retention-days: 1
