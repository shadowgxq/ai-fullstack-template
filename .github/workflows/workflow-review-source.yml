name: Workflow review source
on:
  push:
    branches: [docs/sync-manager-v2-workflow]
    paths: [.github/workflows/workflow-review-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD -o /tmp/workflow-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-source
          path: /tmp/workflow-source.tar.gz
          retention-days: 1
