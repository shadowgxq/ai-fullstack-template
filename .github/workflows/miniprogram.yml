name: Verify miniprogram
on:
  pull_request:
    paths:
      - 'miniprogram/**'
      - 'frontend/src/shared/styles/global.css'
      - 'docs/contracts/generated/backend.openapi.json'
      - 'docs/design/mobile/**'
      - 'docs/engineering/miniprogram/**'
      - '.github/workflows/miniprogram.yml'
  push:
    branches: [main]
    paths:
      - 'miniprogram/**'
      - 'frontend/src/shared/styles/global.css'
      - 'docs/contracts/generated/backend.openapi.json'
      - '.github/workflows/miniprogram.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: miniprogram-${{ github.ref }}
  cancel-in-progress: true
jobs:
  miniprogram:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {package_json_file: miniprogram/package.json}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: miniprogram/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: miniprogram
      - run: pnpm check
        working-directory: miniprogram
      - run: pnpm build:weapp && pnpm check:dist
        working-directory: miniprogram
        env:
          TARO_APP_API_BASE_URL: https://api.example.test
      - name: Verify generators did not change tracked files
        run: git diff --exit-code -- miniprogram
      - uses: actions/upload-artifact@v4
        with:
          name: miniprogram-weapp-build
          path: miniprogram/dist/
          retention-days: 3
