name: Architecture source snapshot
on:
  push:
    branches: [review/architecture-source-snapshot]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6cd30f69e400989a5766816ce5e35dd970b8846f
          persist-credentials: false
      - run: git archive --format=tar --output=/tmp/architecture-source.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-source-6cd30f6
          path: /tmp/architecture-source.tar
          retention-days: 1
          if-no-files-found: error
