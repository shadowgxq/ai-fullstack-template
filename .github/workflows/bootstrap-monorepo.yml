name: Prepare monorepo branch
on:
  push:
    branches: [refactor/fullstack-vibe-monorepo]
    paths: ['.bootstrap/**']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'shadowgxq/ai-fullstack-template' && github.ref == 'refs/heads/refactor/fullstack-vibe-monorepo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.12'}
      - uses: pnpm/action-setup@v4
        with: {package_json_file: frontend/package.json}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python3 .bootstrap/layout.py
      - name: Lock and format service environments
        run: |
          cd backend
          uv sync --locked
          uv run --locked ruff check --fix . || true
          uv run --locked ruff format .
          cd ../ai-service
          uv lock
          uv sync --locked
          uv run --locked ruff check --fix . || true
          uv run --locked ruff format .
          cd ../frontend
          pnpm install --frozen-lockfile
          pnpm format
      - run: make contracts && make docs
      - name: Commit prepared files without altering workflows or forcing the branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'build: lock service dependencies and finish documentation migration'
          git push origin HEAD:refs/heads/refactor/fullstack-vibe-monorepo
      - name: Export prepared source for review
        if: always()
        run: git archive --format=tar.gz HEAD -o /tmp/prepared-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-source
          path: /tmp/prepared-source.tar.gz
          retention-days: 3
