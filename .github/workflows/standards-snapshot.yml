name: Standards review snapshot
on:
  push:
    branches: [docs/layered-engineering-standards]
    paths: [.github/workflows/standards-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD -o /tmp/standards-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: standards-source
          path: /tmp/standards-source.tar.gz
          retention-days: 1
