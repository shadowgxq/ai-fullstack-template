  - en
  read_only_external_origins:
  - https://fonts.googleapis.com
  - https://fonts.gstatic.com
  external_origin_policy: 仅允许现有index声明的公开字体GET；不发送账号、token、输入值或截图到这些来源。外链用例只用loopback URL，其余外站访问取消并报告，不把allowlist文本当实际防火墙。
  postgres_connection_ref: BOOKMARKS_TEST_DATABASE_URL；调用者预先安全配置的独立loopback test数据库，禁止输出连接串。
