command_notes:
  environment: 全部CLI从WSL项目根执行，PATH沿用已核对的Node v22.22.1/pnpm及uv；Docker经实际可用docker.exe desktop-linux入口，不改主机WSL/Docker设置。
  start: 复用当前已启动Docker Web栈，本Skill/计划不隐含重建、重启或安装系统库；服务不满足版本/健康要求时blocked，先取得具体环境处置授权。
  ready: 此命令只提供容器元数据；Runner preflight还需在批准loopback内核对health/ready及前端资源，不能把running直接算业务通过。
  seed: 不执行不存在的seed脚本；已批准后的测试fixture在自身prepare/before内经真实API创建两个run专用账号及逐case数据，并登记run账本。
  cleanup: 不执行全库清空或SQL删除账号；fixture在finally按账本先删本用例收藏、再删组，并核对归零。不得清理admin及其他run。没有账号删除API，空账号/回执残留显式报告。
  playwright_list: 这是经node --help核对的Node内置test runner发现模式，不执行case body。未来测试文件由Runner在批准路径生成，顶层只注册test(TC-ID)，不得在发现阶段建账号或启动浏览器；TAP中的SKIP仅用于发现，绝不计为通过。当前脚本尚不存在，prepare完成并核对33个唯一Playwright标题前不可进入execute。
  playwright_run: Node内置test runner加载Playwright核心库，使用项目已有的assert思路，不新增@playwright/test或测试SDK。顶层唯一TC标题对应本cases，内部矩阵保存子项结果；断言失败不自动重试。
  regression: 真实PostgreSQL回归为必需门禁，缺环境变量、意外skip或未收集到目标测试均blocked；不要用默认SQLite/fake Redis或以往报告替代当前证据。frontend回归与新用例分开记录。
  evidence: 默认不录包含Authorization/Cookie/密码的原始trace或HAR；收集脱敏method/path/status/operation关联及合成数据断言。截图不得出现密码；浏览器认证状态不提交。
preparation:
  status: pending_review_and_prepare
  commands_verified_without_running_tests:
  - npm install --help
  - node --help
  - uv --help
  dependency_setup:
  - command:
    - npm
    - install
    - --prefix
    - .tools/browser
    - --no-save
    - --no-package-lock
    - --ignore-scripts
    - --no-audit
    - --no-fund
    - playwright@1.63.0
    reason: 仓库浏览器README固定版本；当前未安装，只有现存Chromium缓存。仅审核后由Runner prepare执行；版本不存在或环境不兼容则blocked，不自动换最新版。
  - command:
    - .tools/browser/node_modules/.bin/playwright
    - --help
    reason: 安装后实际核对核心库CLI；不凭规划推断已可运行。
  - command:
    - .tools/browser/node_modules/.bin/playwright
    - install
    - chromium
    reason: 仅在已批准prepare中为固定Playwright准备兼容浏览器；现有缓存不可冒认为兼容。不执行--with-deps、sudo或系统安装。
  runtime_capability_checks:
  - 实际加载Playwright并能启动与固定版本兼容的Chromium；失败为blocked，不切换执行器。
  - Computer Use @ Chrome实际入口/真实缩放与字号能力；仅有in-app browser不满足TC-033。
  - BOOKMARKS_TEST_DATABASE_URL已安全配置且通过现有loopback/test库守卫；无此配置不执行真实PG回归。
  - 运行对象候选镜像/静态资源和源版本匹配；确认现有演示账号资源不在测试账本内。
  - 按run创建证据目录和唯一ID账本，确认qa/**/runs被ignore；确认没有本轮并发写入者。
  known_gaps:
  - WSL项目当前无Playwright模块；需审核后prepare。
  - Chrome入口与精确200%文字放大未确认；不得用页面zoom替代文字检查。
  - 独立PostgreSQL测试连接未在此规划中读取或配置；需要执行环境提供。
  abort_rules:
  - 发生源码/需求/设计/计划摘要变化按原协议复核，不自更新批准hash继续。
  - 清理失败影响隔离时阻塞依赖项，保留对象ID与真实残留；不以重建卷修复。
