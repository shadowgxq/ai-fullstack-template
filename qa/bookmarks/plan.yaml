required_gates:
- 33个Playwright用例必须逐ID发现并执行，0 tests/skip/超时不得计通过；TC-033按独立Chrome记录。
- 相关真实PostgreSQL测试不得skip：原子回滚/并发约束/稳定排序/resolve两时序需当前运行证据。
- 每个必测AC至少有一个必测case；所有矩阵子项及必需能力/证据都齐全才允许本轮outcome=pass。
- 缺必测能力/连接/证据且没有已知失败为incomplete；任何确定必测失败为fail；不得以completed代替pass。
- 保留用户最终产品验收与设计接受；不改Manager pending为accepted。
