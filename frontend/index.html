<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A business-neutral frontend with reusable components, themes, and fullstack integration."
    />
    <title>Fullstack Frontend Template</title>
    <script>
      // Keep the first frame consistent with shared/theme, including old saved preferences.
      (function () {
        var mode =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        var preset = 'signal';
        try {
          var raw = localStorage.getItem('ui-theme');
          var state = raw ? JSON.parse(raw).state : null;
          if (state && (state.mode === 'light' || state.mode === 'dark')) mode = state.mode;
          if (state && (state.preset === 'signal' || state.preset === 'neutral'))
            preset = state.preset;
        } catch {
          /* Storage is optional; retain defaults when unavailable. */
        }
        document.documentElement.dataset.theme = mode;
        document.documentElement.dataset.themePreset = preset;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
